<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Voice Generator Free</title>

<style>
body{
margin:0;
padding:0;
background:#0f172a;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
width:90%;
max-width:420px;
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 0 20px rgba(0,255,255,.3);
}

h1{
color:#00ffff;
}

textarea{
width:100%;
height:150px;
padding:10px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
margin-top:15px;
width:100%;
padding:15px;
font-size:18px;
background:#00ffff;
color:black;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#00cccc;
}

p{
margin-top:15px;
font-size:14px;
color:#ccc;
}
</style>

</head>

<body>

<div class="box">

<h1>AI Voice Generator</h1>

<textarea id="text" placeholder="Type your text here..."></textarea>

<button onclick="speak()">Generate Voice</button>

<p>100% Free Demo Website</p>

</div>

<script>

function speak(){

let text=document.getElementById("text").value;

let speech=new SpeechSynthesisUtterance(text);

speech.lang="en-US";

window.speechSynthesis.speak(speech);

}

</script>

</body>
</html>
