<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Voice Generator Pro</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    background: #0f172a;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
}
.ad-space {
    width: 100%;
    max-width: 450px;
    height: 60px;
    background: #1e293b;
    border: 1px dashed #334155;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 12px;
    margin-bottom: 15px;
}
.card {
    width: 100%;
    max-width: 450px;
    background: #1e293b;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 255, 255, 0.15);
}
h1 {
    color: #00ffff;
    font-size: 22px;
    margin-bottom: 15px;
    text-align: center;
}
textarea {
    width: 100%;
    height: 130px;
    padding: 12px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    resize: none;
    outline: none;
    margin-bottom: 15px;
}
textarea:focus {
    border-color: #00ffff;
}
.controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
}
label {
    font-size: 13px;
    color: #cbd5e1;
}
select, input[type="range"] {
    width: 100%;
    padding: 10px;
    background: #0f172a;
    border: 1px solid #334155;
    color: white;
    border-radius: 8px;
    outline: none;
}
.btn-group {
    display: flex;
    gap: 10px;
}
button {
    flex: 1;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}
.btn-speak {
    background: #00ffff;
    color: #0f172a;
}
.btn-speak:hover {
    background: #00cccc;
}
.btn-stop {
    background: #ef4444;
    color: white;
}
.footer-text {
    margin-top: 15px;
    font-size: 12px;
    color: #64748b;
    text-align: center;
}
</style>
</head>
<body>

<!-- Upper Ad Space -->
<div class="ad-space">Advertisement Space</div>

<div class="card">
    <h1>🎙️ AI Voice Generator</h1>
    
    <textarea id="text" placeholder="यहाँ अपना टेक्स्ट लिखें या पेस्ट करें..."></textarea>
    
    <div class="controls">
        <div>
            <label>Select Voice (आवाज़ चुनें):</label>
            <select id="voiceSelect"></select>
        </div>
        <div>
            <label>Speed (गति):</label>
            <input type="range" id="rate" min="0.5" max="1.5" value="1" step="0.1">
        </div>
        <div>
            <label>Pitch (तारत्व):</label>
            <input type="range" id="pitch" min="0.5" max="1.5" value="1" step="0.1">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-speak" onclick="speak()">Play Voice</button>
        <button class="btn-stop" onclick="stop()">Stop</button>
    </div>
</div>

<!-- Lower Ad Space -->
<div class="ad-space" style="margin-top: 15px;">Advertisement Space</div>
<p class="footer-text">100% Free & Unlimited AI Voice Generator Tool</p>

<script>
let synth = window.speechSynthesis;
let voiceSelect = document.getElementById("voiceSelect");
let voices = [];

function loadVoices() {
    voices = synth.getVoices();
    voiceSelect.innerHTML = '';
    voices.forEach((voice, index) => {
        let option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.setAttribute('data-lang', voice.lang);
        option.setAttribute('data-name', voice.name);
        voiceSelect.appendChild(option);
    });
}

loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
}

function speak() {
    if (synth.speaking) {
        synth.cancel();
    }
    let text = document.getElementById("text").value;
    if (text !== '') {
        let utterThis = new SpeechSynthesisUtterance(text);
        let selectedOption = voiceSelect.selectedOptions[0].getAttribute('data-name');
        
        for (let i = 0; i < voices.length; i++) {
            if (voices[i].name === selectedOption) {
                utterThis.voice = voices[i];
                break;
            }
        }
        
        utterThis.rate = document.getElementById("rate").value;
        utterThis.pitch = document.getElementById("pitch").value;
        synth.speak(utterThis);
    }
}

function stop() {
    synth.cancel();
}
</script>

</body>
</html>
