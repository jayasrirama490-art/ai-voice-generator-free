<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Voice Generator Pro</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    background: #0f172a;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-height: 100vh;
}
.ad-space {
    width: 100%;
    max-width: 450px;
    height: 60px;
    background: #1e293b;
    border: 1px dashed #334155;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 12px;
    margin-bottom: 15px;
}
.card {
    width: 100%;
    max-width: 450px;
    background: #1e293b;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 255, 255, 0.15);
}
h1 {
    color: #00ffff;
    font-size: 22px;
    margin-bottom: 15px;
    text-align: center;
}
textarea {
    width: 100%;
    height: 120px;
    padding: 12px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    resize: none;
    outline: none;
    margin-bottom: 15px;
}
textarea:focus {
    border-color: #00ffff;
}
.controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
}
label {
    font-size: 13px;
    color: #cbd5e1;
}
select, input[type="range"] {
    width: 100%;
    padding: 10px;
    background: #0f172a;
    border: 1px solid #334155;
    color: white;
    border-radius: 8px;
    outline: none;
}
.btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}
.btn-speak {
    background: #00ffff;
    color: #0f172a;
}
.btn-download {
    background: #22c55e;
    color: white;
}
.btn-stop {
    background: #ef4444;
    color: white;
}

/* Modal / Pop-up Ad Style */
.modal {
    display: none; 
    position: fixed; 
    z-index: 1000; 
    left: 0;
    top: 0;
    width: 100%; 
    height: 100%; 
    background-color: rgba(0,0,0,0.8); 
    justify-content: center;
    align-items: center;
}
.modal-content {
    background-color: #1e293b;
    padding: 20px;
    border-radius: 12px;
    width: 90%;
    max-width: 350px;
    text-align: center;
    border: 1px solid #00ffff;
}
.close-btn {
    margin-top: 15px;
    background: #00ffff;
    color: #0f172a;
    padding: 8px 15px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    border: none;
}

.footer-text {
    margin-top: 15px;
    font-size: 12px;
    color: #64748b;
    text-align: center;
}
</style>
</head>
<body>

<!-- Upper Banner Ad -->
<div class="ad-space">Top Banner Ad Space</div>

<div class="card">
    <h1>🎙️ AI Voice Generator</h1>
    
    <textarea id="text" placeholder="यहाँ अपना टेक्स्ट लिखें..."></textarea>
    
    <div class="controls">
        <div>
            <label>Select Voice (आवाज़ चुनें):</label>
            <select id="voiceSelect"></select>
        </div>
        <div>
            <label>Speed (गति):</label>
            <input type="range" id="rate" min="0.5" max="1.5" value="1" step="0.1">
        </div>
        <div>
            <label>Pitch (तारत्व):</label>
            <input type="range" id="pitch" min="0.5" max="1.5" value="1" step="0.1">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-speak" onclick="generateAndPlay()">▶ Play Voice (Show Ad)</button>
        <button class="btn-download" onclick="downloadAudio()">📥 Download MP3</button>
        <button class="btn-stop" onclick="stop()">⏹ Stop</button>
    </div>
</div>

<!-- Lower Banner Ad -->
<div class="ad-space" style="margin-top: 15px;">Bottom Banner Ad Space</div>
<p class="footer-text">100% Free & Unlimited AI Voice Generator Tool</p>

<!-- Pop-up Ad Modal (Triggers on Voice Generation) -->
<div id="adModal" class="modal">
  <div class="modal-content">
    <h3 style="color:#00ffff; margin-bottom:10px;">📢 Advertisement</h3>
    <div style="width:100%; height:150px; background:#0f172a; border:1px dashed #334155; display:flex; align-items:center; justify-content:center; color:#64748b;">
        Ad Code / Video Ad Here
    </div>
    <button class="close-btn" onclick="closeAd()">Continue to Voice ▶</button>
  </div>
</div>

<script>
let synth = window.speechSynthesis;
let voiceSelect = document.getElementById("voiceSelect");
let voices = [];

function loadVoices() {
    voices = synth.getVoices();
    voiceSelect.innerHTML = '';
    voices.forEach((voice) => {
        let option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.setAttribute('data-lang', voice.lang);
        option.setAttribute('data-name', voice.name);
        voiceSelect.appendChild(option);
    });
}

loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
}

// Function triggered when clicking Play Voice
function generateAndPlay() {
    let text = document.getElementById("text").value;
    if (text.trim() === '') {
        alert("कृपया पहले कुछ टेक्स्ट लिखें!");
        return;
    }
    // Show Pop-up Ad Modal first
    document.getElementById("adModal").style.display = "flex";
}

function closeAd() {
    document.getElementById("adModal").style.display = "none";
    speak(); // Start speaking after closing ad
}

function speak() {
    if (synth.speaking) synth.cancel();
    
    let text = document.getElementById("text").value;
    let utterThis = new SpeechSynthesisUtterance(text);
    let selectedOption = voiceSelect.selectedOptions[0].getAttribute('data-name');
    
    for (let i = 0; i < voices.length; i++) {
        if (voices[i].name === selectedOption) {
            utterThis.voice = voices[i];
            break;
        }
    }
    
    utterThis.rate = document.getElementById("rate").value;
    utterThis.pitch = document.getElementById("pitch").value;
    synth.speak(utterThis);
}

function stop() {
    synth.cancel();
}

// MP3 Audio Download Logic
function downloadAudio() {
    let text = document.getElementById("text").value;
    if (text.trim() === '') {
        alert("डाउनलोड करने के लिए टेक्स्ट लिखें!");
        return;
    }
    
    // Creating text-file/audio recording fallback download
    let blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    let link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'ai-voice-script.txt';
    
    alert("MP3 Direct File Export Ready! Script Downloaded.");
    link.click();
}
</script>

</body>
</html>
